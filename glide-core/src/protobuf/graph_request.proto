syntax = "proto3";
package graph_request;

// Graph-only transport. Existing command request IDs and response layouts are unchanged.
message Parameter {
    oneof value {
        bool null_value = 1;
        bool boolean_value = 2;
        sint64 integer_value = 3;
        double double_value = 4;
        string string_value = 5;
        ParameterList list_value = 6;
        ParameterMap map_value = 7;
    }
}

message ParameterList {
    repeated Parameter values = 1;
}

message ParameterEntry {
    string key = 1;
    Parameter value = 2;
}

message ParameterMap {
    repeated ParameterEntry entries = 1;
}

message QueryRequest {
    string graph_name = 1;
    string query = 2;
    ParameterMap parameters = 3;
    optional uint64 timeout_ms = 4;
    bool readonly = 5;
    uint32 database = 6;
    uint64 database_epoch = 7;
}
